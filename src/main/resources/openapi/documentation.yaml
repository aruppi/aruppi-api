openapi: "3.0.3"
info:
  title: "Aruppi API"
  description: "Public REST API for anime, themes, rankings, gallery and news."
  version: "5.9.5"
servers:
  - url: "http://0.0.0.0:8080/api/v5"
tags:
  - name: "news"
  - name: "anime"
  - name: "manga"
  - name: "search"
  - name: "themes"
  - name: "gallery"
  - name: "rankings"
  - name: "schedule"
  - name: "anitakume"
  - name: "radio"
paths:
  /news/es:
    get:
      tags: ["news"]
      summary: "Spanish news"
      description: "Returns the latest Spanish-language news feed aggregated from multiple RSS sources."
      responses:
        "200":
          $ref: "#/components/responses/OkArray"

  /news/en:
    get:
      tags: ["news"]
      summary: "English news"
      description: "Returns the latest English-language news feed aggregated from multiple RSS sources."
      responses:
        "200":
          $ref: "#/components/responses/OkArray"

  /anime:
    get:
      tags: ["anime"]
      summary: "Anime list filtered by type/status"
      description: "Lists anime stored in the directory and allows filtering by type, status and NSFW flag. When page or size is provided, the response is paginated; otherwise it keeps the legacy array response."
      parameters:
        - $ref: "#/components/parameters/AnimeTypeQuery"
        - $ref: "#/components/parameters/AnimeStatusQuery"
        - $ref: "#/components/parameters/NsfwQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/AnimeSizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkAnimeList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /anime/{id}:
    get:
      tags: ["anime"]
      summary: "Anime detail by MAL id"
      description: "Fetches a single anime by MyAnimeList identifier and returns the detailed metadata object."
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          $ref: "#/components/responses/OkObject"
        "404":
          $ref: "#/components/responses/NotFound"

  /anime/random:
    get:
      tags: ["anime"]
      summary: "Random anime"
      description: "Returns one random anime from the directory, with an optional NSFW filter."
      parameters:
        - $ref: "#/components/parameters/NsfwQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkObject"
        "404":
          $ref: "#/components/responses/NotFound"

  /manga:
    get:
      tags: ["manga"]
      summary: "Manga list"
      description: "Returns a paginated manga list from the manga directory cache. Results are cached in MongoDB by page, size and filters."
      parameters:
        - $ref: "#/components/parameters/MangaTypeQuery"
        - $ref: "#/components/parameters/MangaStatusQuery"
        - $ref: "#/components/parameters/SfwQuery"
        - $ref: "#/components/parameters/QQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"
        "400":
          $ref: "#/components/responses/BadRequest"

  /manga/{id}:
    get:
      tags: ["manga"]
      summary: "Manga detail by MAL id"
      description: "Fetches a manga detail by MyAnimeList identifier and caches it in MongoDB."
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          $ref: "#/components/responses/OkObject"
        "404":
          $ref: "#/components/responses/NotFound"

  /manga/random:
    get:
      tags: ["manga"]
      summary: "Random manga"
      description: "Returns one random manga from Jikan. Random responses are not cached."
      responses:
        "200":
          $ref: "#/components/responses/OkObject"
        "404":
          $ref: "#/components/responses/NotFound"

  /manga/directory:
    get:
      tags: ["manga"]
      summary: "Manga directory"
      description: "Alias of /manga for directory-style clients. Supports q, type, status, sfw, page and size."
      parameters:
        - $ref: "#/components/parameters/MangaTypeQuery"
        - $ref: "#/components/parameters/MangaStatusQuery"
        - $ref: "#/components/parameters/SfwQuery"
        - $ref: "#/components/parameters/QQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"
        "400":
          $ref: "#/components/responses/BadRequest"

  /search:
    get:
      tags: ["search"]
      summary: "Unified search"
      description: "Searches anime, manga and characters through a single endpoint."
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/SearchTypeQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SearchSizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkObject"
        "400":
          $ref: "#/components/responses/BadRequest"

  /anime/lastEpisodes:
    get:
      tags: ["anime"]
      summary: "Latest episodes"
      description: "Returns the airing anime with latest episodes cached per current day."
      responses:
        "200":
          $ref: "#/components/responses/OkArray"

  /anime/suggestions:
    get:
      tags: ["anime"]
      summary: "Anime suggestions by tags"
      description: "Finds anime matching one or more tags, excluding unsupported content types."
      parameters:
        - $ref: "#/components/parameters/TagsQuery"
        - $ref: "#/components/parameters/NsfwQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkArray"
        "400":
          $ref: "#/components/responses/BadRequest"

  /anime/season:
    get:
      tags: ["anime"]
      summary: "Anime by season"
      description: "Returns the anime released in a given year and season."
      parameters:
        - $ref: "#/components/parameters/YearQuery"
        - $ref: "#/components/parameters/StationQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkArray"

  /anime/season/upcoming:
    get:
      tags: ["anime"]
      summary: "Upcoming anime season"
      description: "Returns the upcoming anime season from Jikan, including pagination metadata."
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/FilterQuery"
        - $ref: "#/components/parameters/SfwQuery"
        - $ref: "#/components/parameters/UnapprovedQuery"
        - $ref: "#/components/parameters/ContinuingQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkObject"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /anime/season/yearIndex:
    get:
      tags: ["anime"]
      summary: "Year and season index"
      description: "Returns the available years together with the seasons found in the directory."
      responses:
        "200":
          $ref: "#/components/responses/OkArray"

  /anime/directory:
    get:
      tags: ["anime"]
      summary: "Anime directory"
      description: "Returns the paginated anime directory, optionally filtered by type."
      parameters:
        - $ref: "#/components/parameters/AnimeTypeQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"

  /anime/directory/{type}:
    get:
      tags: ["anime"]
      summary: "Anime directory by type in path"
      description: "Returns the anime directory for a specific type provided in the path segment."
      parameters:
        - $ref: "#/components/parameters/TypePath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkArray"
        "400":
          $ref: "#/components/responses/BadRequest"

  /themes/anime:
    get:
      tags: ["themes"]
      summary: "Anime themes list"
      description: "Returns the cached list of anime with their associated theme metadata."
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"

  /themes/anime/{slug}:
    get:
      tags: ["themes"]
      summary: "Anime themes detail"
      description: "Returns the full theme details for a given anime slug."
      parameters:
        - $ref: "#/components/parameters/SlugPath"
      responses:
        "200":
          $ref: "#/components/responses/OkObject"
        "404":
          $ref: "#/components/responses/NotFound"

  /themes/anime/{slug}/random:
    get:
      tags: ["themes"]
      summary: "Random theme for an anime"
      description: "Returns one random opening/ending entry for the provided anime slug."
      parameters:
        - $ref: "#/components/parameters/SlugPath"
      responses:
        "200":
          $ref: "#/components/responses/OkObject"
        "404":
          $ref: "#/components/responses/NotFound"

  /themes/artists:
    get:
      tags: ["themes"]
      summary: "Artists list"
      description: "Returns the paginated artists index used by AnimeThemes."
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"

  /themes/artists/{slug}:
    get:
      tags: ["themes"]
      summary: "Artist detail"
      description: "Returns a single artist and the songs associated with that artist."
      parameters:
        - $ref: "#/components/parameters/SlugPath"
      responses:
        "200":
          $ref: "#/components/responses/OkObject"
        "404":
          $ref: "#/components/responses/NotFound"

  /themes/songs:
    get:
      tags: ["themes"]
      summary: "Song list or search"
      description: "Searches songs by query or returns the cached paginated song list if no query is provided."
      parameters:
        - $ref: "#/components/parameters/QQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"

  /themes/songs/random:
    get:
      tags: ["themes"]
      summary: "Random song"
      description: "Returns one random song together with its related anime information."
      responses:
        "200":
          $ref: "#/components/responses/OkObject"
        "404":
          $ref: "#/components/responses/NotFound"

  /gallery:
    get:
      tags: ["gallery"]
      summary: "Image search in gallery"
      description: "Searches anime-pictures images by query text and returns paginated results."
      parameters:
        - $ref: "#/components/parameters/QueryQuery"
        - $ref: "#/components/parameters/PageQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"

  /gallery/lastPosts:
    get:
      tags: ["gallery"]
      summary: "Latest gallery posts"
      description: "Returns the latest gallery posts cached by page."
      parameters:
        - $ref: "#/components/parameters/PageQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"

  /top/anime:
    get:
      tags: ["rankings"]
      summary: "Anime ranking"
      description: "Requires `type`, `filter`, `page` and `size` as query values."
      parameters:
        - $ref: "#/components/parameters/TopTypeQuery"
        - $ref: "#/components/parameters/FilterQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"
        "400":
          $ref: "#/components/responses/BadRequest"

  /top/anime/topTen:
    get:
      tags: ["rankings"]
      summary: "Anime top ten"
      description: "Returns the top ten anime for the requested type and filter combination."
      parameters:
        - $ref: "#/components/parameters/TopTypeQuery"
        - $ref: "#/components/parameters/FilterQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkArray"

  /top/manga:
    get:
      tags: ["rankings"]
      summary: "Manga ranking"
      description: "Returns the paginated manga ranking for a given type and filter."
      parameters:
        - $ref: "#/components/parameters/TopTypeQuery"
        - $ref: "#/components/parameters/FilterQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"
        "400":
          $ref: "#/components/responses/BadRequest"

  /top/people:
    get:
      tags: ["rankings"]
      summary: "People ranking"
      description: "Returns the paginated people ranking from Jikan."
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"

  /top/characters:
    get:
      tags: ["rankings"]
      summary: "Character ranking"
      description: "Returns the paginated character ranking from Jikan."
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          $ref: "#/components/responses/OkPagination"

  /schedule:
    get:
      tags: ["schedule"]
      summary: "Weekly schedule"
      description: "Returns the weekly anime schedule grouped by day of the week."
      responses:
        "200":
          $ref: "#/components/responses/OkObject"

  /schedule/{day}:
    get:
      tags: ["schedule"]
      summary: "Schedule by day"
      description: "Returns the schedule for a single day. Day must be one of monday through sunday."
      parameters:
        - $ref: "#/components/parameters/DayPath"
      responses:
        "200":
          $ref: "#/components/responses/OkArray"
        "400":
          $ref: "#/components/responses/BadRequest"

  /anitakume:
    get:
      tags: ["anitakume"]
      summary: "Anitakume podcast episodes"
      description: "Returns the podcast episodes fetched from the Anitakume RSS feed."
      responses:
        "200":
          $ref: "#/components/responses/OkArray"

  /radio:
    get:
      tags: ["radio"]
      summary: "Radio stations list"
      description: "Returns the full list of radio stations stored in the database."
      responses:
        "200":
          $ref: "#/components/responses/OkArray"

components:
  parameters:
    IdPath:
      name: "id"
      in: "path"
      required: true
      schema:
        type: "integer"
    TypePath:
      name: "type"
      in: "path"
      required: true
      schema:
        type: "string"
    SlugPath:
      name: "slug"
      in: "path"
      required: true
      schema:
        type: "string"
    DayPath:
      name: "day"
      in: "path"
      required: true
      schema:
        type: "string"
        enum: ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
    PageQuery:
      name: "page"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        default: 1
    SizeQuery:
      name: "size"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        default: 25
    LimitQuery:
      name: "limit"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        default: 25
    AnimeSizeQuery:
      name: "size"
      in: "query"
      required: false
      description: "Page size for /anime when paginated. Maximum value is 100."
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 25
    QueryQuery:
      name: "query"
      in: "query"
      required: false
      schema:
        type: "string"
    QQuery:
      name: "q"
      in: "query"
      required: false
      schema:
        type: "string"
    SearchQuery:
      name: "q"
      in: "query"
      required: true
      schema:
        type: "string"
      description: "Search text."
    SearchTypeQuery:
      name: "type"
      in: "query"
      required: false
      schema:
        type: "string"
        example: "anime,manga,characters"
      description: "Comma-separated categories. Supported values: anime, manga, characters."
    SearchSizeQuery:
      name: "size"
      in: "query"
      required: false
      description: "Results per category. Maximum value is 10."
      schema:
        type: "integer"
        minimum: 1
        maximum: 10
        default: 5
    TagsQuery:
      name: "tags"
      in: "query"
      required: true
      schema:
        type: "string"
      description: "Comma-separated tags."
    YearQuery:
      name: "year"
      in: "query"
      required: false
      schema:
        type: "integer"
    StationQuery:
      name: "station"
      in: "query"
      required: false
      schema:
        type: "string"
        example: "SPRING"
    NsfwQuery:
      name: "nsfw"
      in: "query"
      required: false
      schema:
        type: "boolean"
        default: false
    SfwQuery:
      name: "sfw"
      in: "query"
      required: false
      schema:
        type: "boolean"
        default: true
    UnapprovedQuery:
      name: "unapproved"
      in: "query"
      required: false
      schema:
        type: "boolean"
        default: false
    ContinuingQuery:
      name: "continuing"
      in: "query"
      required: false
      schema:
        type: "boolean"
        default: false
    AnimeTypeQuery:
      name: "type"
      in: "query"
      required: false
      schema:
        type: "string"
    AnimeStatusQuery:
      name: "status"
      in: "query"
      required: false
      schema:
        type: "string"
    MangaTypeQuery:
      name: "type"
      in: "query"
      required: false
      schema:
        type: "string"
        enum: ["manga", "novel", "lightnovel", "oneshot", "doujin", "manhwa", "manhua"]
    MangaStatusQuery:
      name: "status"
      in: "query"
      required: false
      schema:
        type: "string"
        enum: ["publishing", "complete", "hiatus", "discontinued", "upcoming"]
    TopTypeQuery:
      name: "type"
      in: "query"
      required: true
      schema:
        type: "string"
      description: "For rankings, expected values depend on endpoint type."
    FilterQuery:
      name: "filter"
      in: "query"
      required: false
      schema:
        type: "string"

  responses:
    OkArray:
      description: "Successful response (array)"
      content:
        application/json:
          schema:
            type: "array"
            items:
              $ref: "#/components/schemas/GenericObject"
          examples:
            Example:
              $ref: "#/components/examples/ArrayExample"
    OkObject:
      description: "Successful response (object)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericObject"
          examples:
            Example:
              $ref: "#/components/examples/ObjectExample"
    OkPagination:
      description: "Successful paginated response"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaginationResponse"
          examples:
            Example:
              $ref: "#/components/examples/PaginationExample"
    OkAnimeList:
      description: "Successful anime list response. Returns an array by default, or a paginated object when page or size is provided."
      content:
        application/json:
          schema:
            oneOf:
              - type: "array"
                items:
                  $ref: "#/components/schemas/GenericObject"
              - $ref: "#/components/schemas/PaginationResponse"
          examples:
            Paginated:
              $ref: "#/components/examples/PaginationExample"
    BadRequest:
      description: "Invalid request"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            Example:
              $ref: "#/components/examples/ErrorExample"
    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            Example:
              $ref: "#/components/examples/ErrorExample"
    InternalServerError:
      description: "Unexpected error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            Example:
              $ref: "#/components/examples/ErrorExample"

  examples:
    ArrayExample:
      summary: "Example news list payload"
      value:
        - source: "MangaLatam"
          sourceDescription: "MangaLatam RSS feed"
          link: "https://www.mangalatam.com/2026/04/sample-article.html"
          title: "Nuevo anuncio sobre una pelicula de anime"
          date: "2026-04-24T10:30:00Z"
          description: "Resumen breve de la noticia."
          content: "Contenido completo de la noticia."
          image: "https://example.com/news/image.jpg"
          categories: ["anime", "news"]
        - source: "Somos Kudasai"
          sourceDescription: "Somos Kudasai RSS feed"
          link: "https://somoskudasai.com/noticias/otro-ejemplo"
          title: "La temporada de primavera arranca con novedades"
          date: "2026-04-24T12:15:00Z"
          description: "Otra noticia de ejemplo."
          content: "Más contenido de ejemplo."
          image: "https://example.com/news/image-2.jpg"
          categories: ["season", "anime"]
    ObjectExample:
      summary: "Example anime theme detail payload"
      value:
        id: 1502
        name: "Kimetsu no Yaiba"
        slug: "kimetsu_no_yaiba"
        year: 2019
        season: "Spring"
        synopsis: "Desde la muerte de su padre, Tanjiro ha sostenido a su familia..."
        image: "https://api.animethemes.moe/images/anime/1502.jpg"
        themes:
          - id: 2
            type: "OP"
            slug: "OP1"
            sequence: 1
            song:
              id: 2
              title: "Gurenge"
            entries:
              - id: 3
                episodes: "1-26"
                nsfw: false
                spoiler: false
                videos:
                  - link: "https://v.animethemes.moe/KimetsuNoYaiba-OP1.webm"
                    resolution: 1080
                    nc: true
                    subbed: false
                    lyrics: false
                    source: "BD"
                    overlap: "None"
    PaginationExample:
      summary: "Example anime directory payload"
      value:
        page: 1
        size: 25
        data:
          - malId: 5114
            type: "TV"
            title: "Fullmetal Alchemist: Brotherhood"
            image: "https://cdn.myanimelist.net/images/anime/1223/96541.jpg"
            score: "9.10"
            season:
              year: 2009
              station: "SPRING"
          - malId: 16498
            type: "TV"
            title: "Shingeki no Kyojin"
            image: "https://cdn.myanimelist.net/images/anime/10/47347.jpg"
            score: "8.55"
            season:
              year: 2013
              station: "SPRING"
    ErrorExample:
      summary: "Example error payload"
      value:
        error: "Invalid gallery endpoint. Valid endpoints are: /api/v5/gallery and /api/v5/gallery/lastPosts"
        code: "INVALID_GALLERY_ENDPOINT"
        status: 404
        path: "/api/v5/gallery/unknown"
        requestId: "0f2d6d40-4b7a-4f4a-a1a1-f9d8cf8d6a21"
        version: "5.9.5"
        documentation:
          redoc: "/api/v5/docs"
          swagger: "/api/v5/swagger"
          openapi: "/api/v5/openapi.yaml"

  schemas:
    GenericObject:
      type: "object"
      additionalProperties: true
    PaginationResponse:
      type: "object"
      properties:
        page:
          type: "integer"
        size:
          type: "integer"
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/GenericObject"
    ErrorResponse:
      type: "object"
      properties:
        error:
          type: "string"
        code:
          type: "string"
          description: "Stable machine-readable error code."
        status:
          type: "integer"
          format: "int32"
        path:
          type: "string"
        requestId:
          type: "string"
          description: "Request correlation id. Uses X-Request-ID when provided, otherwise generated by the API."
        version:
          type: "string"
        documentation:
          $ref: "#/components/schemas/DocumentationLinks"
    DocumentationLinks:
      type: "object"
      properties:
        redoc:
          type: "string"
        swagger:
          type: "string"
        openapi:
          type: "string"
